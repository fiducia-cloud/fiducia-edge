# Cloudflare Wrangler config: Worker name, entry point, and deploy settings.
name = "fiducia-edge"
main = "src/worker.mjs"
compatibility_date = "2026-06-01"

# Regional load-balancer origins the edge forwards to (ordered primary→fallback).
# Override per environment / via secrets. In production prefer CF KV (below) so
# the list + per-region health can change without a redeploy.
[vars]
FIDUCIA_REGIONS = '[{"name":"us-east","url":"https://us-east.lb.fiducia.cloud"},{"name":"eu-west","url":"https://eu-west.lb.fiducia.cloud"}]'
FIDUCIA_DEPLOYMENT_MODE = "production"
FIDUCIA_CROSS_ORIGIN_RESOURCE_POLICY = "same-site"
FIDUCIA_AUTH_REQUIRED = "true"
FIDUCIA_AUTH_URL = "https://auth.fiducia.cloud"
FIDUCIA_AUTH_CACHE_TTL_SECONDS = "60"
FIDUCIA_AUTH_NEGATIVE_CACHE_TTL_SECONDS = "5"
FIDUCIA_AUTH_JWKS_TTL_SECONDS = "600"
FIDUCIA_AUTH_JWT_CACHE_TTL_SECONDS = "60"
FIDUCIA_JWT_ISSUER = "fiducia-auth"
FIDUCIA_JWT_AUDIENCE = "fiducia-api"

# Reader-only revocation authority. The endpoint is non-secret and may be
# overridden per environment. Inject FIDUCIA_REVOCATION_READER_SECRET with
# `wrangler secret put`; never commit its value or reuse the writer credential.
FIDUCIA_REVOCATION_CHECK_URL = "https://auth.fiducia.cloud/v1/revocations/check"
FIDUCIA_REVOCATION_CACHE_TTL_SECONDS = "30"
FIDUCIA_REVOCATION_CACHE_CAPACITY = "10000"
FIDUCIA_REVOCATION_TIMEOUT_MS = "2000"

# Optional browser/API connection origins may be declared with a whitespace- or
# comma-separated list of complete HTTPS/WSS origins. Production rejects HTTP,
# wildcards, credentials, paths, queries, fragments, and directive injection.
# FIDUCIA_CSP_CONNECT_SRC = "https://app.fiducia.cloud https://admin.fiducia.cloud"

# Optional: live routing config + per-region health, read at the edge.
# [[kv_namespaces]]
# binding = "FIDUCIA_CONFIG"
# id = "<kv-namespace-id>"

# Optional: bind a Cloudflare Analytics Engine dataset as REVOCATION_METRICS.
# The revocation boundary emits only bounded metric/outcome labels and numeric
# latency/staleness values; it never emits tokens, jti, tenant, or subject data.
# [[analytics_engine_datasets]]
# binding = "REVOCATION_METRICS"
# dataset = "fiducia_edge_revocation"

# Atomic distributed rate limiting. Keep this binding whenever
# FIDUCIA_RATE_LIMIT_PER_MINUTE is greater than zero; the Worker fails closed if
# a positive limit is configured without the Durable Object.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1-rate-limiter"
new_sqlite_classes = ["RateLimiter"]

# Optional: if the edge ever needs key→shard, ship the fiducia-routing crate as
# WASM instead of reimplementing the hash in JS.
# [[wasm_modules]]
# binding = "ROUTING"
# source = "fiducia_routing.wasm"
