name: secrets-audit

# Fail-closed check that no plaintext secret can reach this repository.
#
# Runs with NO age key on purpose. Everything it asserts is key-independent:
# that no plaintext env file is tracked or staged, that .gitignore still denies
# them, that nothing was force-added past those rules, and that every file in
# env/enc/ is genuinely sops-encrypted with at least two recipients. Handing CI
# a decryption key merely to lint would defeat the audit it is performing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  env-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # env-check inspects tracked history, not just the worktree.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node.js for flags2env
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          package-manager-cache: false

      - name: Install canonical flags2env
        run: |
          set -euo pipefail
          npm install --global @oresoftware/f2e@0.3.0
          flags2env --version

      - name: Check out pinned ores-sops
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-sops
          ref: 47d5bd4ddc13ccc3c9bde53ee0ee8e2fa846fa94
          path: .tools/ores-sops
          fetch-depth: 1
          persist-credentials: false

      - name: Admit pinned ores-sops tool
        env:
          ORES_SOPS_REV: 47d5bd4ddc13ccc3c9bde53ee0ee8e2fa846fa94
        run: |
          set -euo pipefail
          actual="$(git -C .tools/ores-sops rev-parse HEAD)"
          test "$actual" = "$ORES_SOPS_REV"
          test -x .tools/ores-sops/ores-sops
          test -x .tools/ores-sops/scripts/ores-sops-core
          echo "$GITHUB_WORKSPACE/.tools/ores-sops" >> "$GITHUB_PATH"
          .tools/ores-sops/ores-sops --version

      - name: Install just
        env:
          JUST_VERSION: 1.51.0
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/just.tar.gz \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version

      - name: just env-check
        run: just env-check
