# CI: audit, lint, unit-test, and browser-test the Worker on push and pull request.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: repo
      # GitHub Actions checks out one repo in isolation, but npm ci needs the
      # sibling `file:../` dep (@fiducia/interfaces) present alongside so
      # `../fiducia-interfaces` resolves.
      - name: Validate GitHub Actions
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: repo/.github/workflows/ci.yml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-interfaces
          ref: 487e470c45ab5851e8f6f3b1dc048fe067fbf408
          path: fiducia-interfaces
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.22.1"
      - run: npm ci --ignore-scripts
        working-directory: repo
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: repo
      - name: Block critical development-tool vulnerabilities
        run: npm audit --audit-level=critical
        working-directory: repo
      - name: Syntax checks
        run: npm run check
        working-directory: repo
      - name: Unit and integration tests
        run: npm test
        working-directory: repo
      - name: Locate Chrome
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              printf 'path=%s\n' "$(command -v "$candidate")" >> "$GITHUB_OUTPUT"
              "$candidate" --version
              exit 0
            fi
          done
          echo "::error::No Chrome or Chromium executable is installed on the runner"
          exit 1
      - name: Browser security-boundary smoke tests
        env:
          BROWSER_ARTIFACT_DIR: artifacts/browser-smoke
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
        run: npm run test:browser
        working-directory: repo
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fiducia-edge-browser-smoke-${{ github.run_attempt }}
          path: repo/artifacts/browser-smoke
          if-no-files-found: error
          retention-days: 14
